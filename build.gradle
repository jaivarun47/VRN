plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
jar {
    manifest {
        attributes(
                'Main-Class': 'com.vrn.VrnApplication'
        )
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect { zipTree(it) }
    }
}

group = 'com.vrn'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'info.picocli:picocli:4.7.7'
}

test {
    useJUnitPlatform()
    def executableJar = tasks.named('jar', Jar)
    dependsOn executableJar
    inputs.file(executableJar.flatMap { it.archiveFile }).withPropertyName('executableJar')
    systemProperty 'vrn.executableJar', executableJar.get().archiveFile.get().asFile.absolutePath
}
